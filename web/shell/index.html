<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:,">
<title>Ymir Web — Sega Saturn 模拟器</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px;
    background: #14161a; color: #d7dae0;
    font-family: system-ui, "Segoe UI", sans-serif;
    display: flex; flex-direction: column; align-items: center; gap: 12px;
  }
  h1 { font-size: 18px; margin: 4px 0; font-weight: 600; }
  .panel {
    background: #1d2026; border: 1px solid #2c313a; border-radius: 8px;
    padding: 12px 16px; width: min(760px, 96vw);
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
  }
  .panel label { font-size: 13px; color: #9aa3b2; }
  .panel .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  button {
    background: #2f6fed; color: #fff; border: 0; border-radius: 6px;
    padding: 8px 14px; font-size: 14px; cursor: pointer;
  }
  button:disabled { background: #3a4150; cursor: not-allowed; }
  button.secondary { background: #3a4150; }
  input[type=file] { font-size: 12px; color: #9aa3b2; max-width: 260px; }
  #status { font-size: 12px; color: #8f98a8; min-height: 1.2em; }
  #screen {
    background: #000; border: 1px solid #2c313a; border-radius: 4px;
    image-rendering: pixelated; width: min(760px, 96vw);
  }
  #fps { font-size: 12px; color: #6f7a8c; }
  .hint { font-size: 12px; color: #6f7a8c; line-height: 1.7; width: min(760px, 96vw); }
  kbd {
    background: #2c313a; border-radius: 4px; padding: 1px 6px;
    font-family: inherit; font-size: 11px;
  }
</style>
</head>
<body>
  <h1>Ymir Web — Sega Saturn 模拟器（WASM）</h1>

  <div class="panel">
    <div class="row">
      <label>BIOS (IPL, 512KB)</label>
      <input type="file" id="biosFile" accept=".bin,.rom">
    </div>
    <div class="row">
      <label>光盘镜像（.chd / .cue+.bin / .iso，可多选）</label>
      <input type="file" id="discFiles" multiple accept=".chd,.cue,.bin,.iso,.mds,.mdf,.ccd,.img,.sub">
    </div>
    <div class="row">
      <button id="startBtn" disabled>启动</button>
      <button id="resetBtn" class="secondary" disabled>硬复位</button>
      <span id="fps"></span>
    </div>
  </div>

  <div id="status">正在加载 WASM 模块…</div>
  <canvas id="screen" width="704" height="480"></canvas>

  <div class="hint">
    按键映射：方向键 = 十字键，<kbd>Z</kbd><kbd>X</kbd><kbd>C</kbd> = A/B/C，
    <kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> = X/Y/Z，<kbd>Q</kbd>/<kbd>W</kbd> = L/R，
    <kbd>Enter</kbd> = Start。BIOS 与存档（备份 RAM）会自动保存在浏览器 IndexedDB 中。<br>
    提示：推荐使用 .chd 镜像（占用内存最少）。BIOS 与游戏 ROM 受版权保护，请使用自己合法持有的文件。
  </div>

  <script src="ymir-web.js"></script>
  <script src="main.js"></script>
</body>
</html>
